<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#21b45a">
<title>Mất kết nối | NutriVision AI</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg: #f5f8f6; --fg: #1a2420; --muted: #5b6b64; --card: #fff; --track: #e8efeb; --brand: #1a9a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1411; --fg: #e6efe9; --muted: #93a59c; --card: #151f1a; --track: #24332b; --brand: #2ec46a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 420px; }
  svg { width: 176px; height: 132px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  a { display: inline-block; background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; padding: 10px 20px; border-radius: 10px; }
  a:focus-visible { outline: 3px solid var(--track); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 200 150" aria-hidden="true">
    <ellipse cx="100" cy="136" rx="58" ry="7" fill="var(--track)"/>
    <path d="M40 70a85 85 0 0 1 120 0" stroke="var(--muted)" stroke-width="9" stroke-linecap="round" fill="none" opacity=".35"/>
    <path d="M60 92a56 56 0 0 1 80 0" stroke="var(--muted)" stroke-width="9" stroke-linecap="round" fill="none" opacity=".55"/>
    <circle cx="100" cy="116" r="9" fill="var(--brand)"/>
    <path d="M58 30l84 84" stroke="#ff795e" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <h1>Bạn đang ngoại tuyến</h1>
  <p>NutriVision AI cần kết nối mạng để nhận diện món ăn và đồng bộ dữ liệu. Hãy kiểm tra Wi-Fi/4G rồi thử lại.</p>
  <a href="/dashboard">Thử lại</a>
</main>
</body>
</html>
