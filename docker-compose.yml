# SQL Server 2022 cho môi trường dev (backend Development kết nối localhost:1433, user sa).
# Chạy: docker compose up -d --wait     Dừng: docker compose stop     Xóa sạch dữ liệu: docker compose down -v
# Mật khẩu dưới đây CHỈ dùng cho máy dev; môi trường thật đặt qua biến môi trường / Vault.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nutrivision-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NutriVision@2026"
      MSSQL_PID: "Developer"
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "1433:1433"
    volumes:
      - nutrivision-sql:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  nutrivision-sql:
